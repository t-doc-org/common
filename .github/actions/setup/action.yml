name: Set up for running t-doc
inputs:
  build-sites:
    description: "When true, install packages required for building sites."
    default: true
  dev-pkgs:
    description: "When true, install packages required for development."
    default: false
  ssh-key:
    description: "SSH key to use to checkout the common repository."
    required: true
outputs:
  python-path:
    description: "The absolute path to the Python or PyPy executable."
    value: ${{ steps.python.outputs.python-path }}

runs:
  using: composite
  steps:
    - name: Set up environment
      shell: bash
      run: |
        echo "TDOC_SANDBOX=github" >> "${GITHUB_ENV}"
    - name: Checkout t-doc/common repository
      uses: actions/checkout@v7
      with:
        repository: t-doc-org/common
        ref: main
        path: common
        ssh-key: ${{ inputs.ssh-key }}
    - name: Get recommended Python version
      id: version
      shell: python
      run: |
        import os
        import tomllib
        with open('common/config/run.toml', 'rb') as f:
          config = tomllib.load(f)
        with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
          f.write(f"version={config["python"]["recommend"]}\n")
    - name: Install Python
      id: python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ steps.version.outputs.version }}
    - name: Install development packages
      if: ${{ inputs.dev-pkgs == 'true' }}
      shell: bash
      run: |
        ${{ steps.python.outputs.python-path }} -P -m pip install \
            --require-hashes --only-binary=:all: --no-deps \
            --requirement=common/config/dev.req
    - name: Update system package index
      if: ${{ inputs.build-sites == 'true' }}
      shell: bash
      run: sudo apt-get update
    - name: Install system packages
      if: ${{ inputs.build-sites == 'true' }}
      shell: bash
      run: |
        echo "ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true" \
            | sudo debconf-set-selections
        sudo apt-get install --yes --no-install-recommends \
            fonts-dejavu \
            fonts-freefont-otf \
            fonts-freefont-ttf \
            fonts-inconsolata \
            fonts-liberation \
            fonts-liberation-sans-narrow \
            fonts-noto \
            fonts-roboto \
            graphviz \
            gsfonts \
            libgvplugin-devil8 \
            libgvplugin-gd8 \
            libgvplugin-gs8 \
            libgvplugin-neato-layout8 \
            libgvplugin-pango8 \
            libgvplugin-poppler8 \
            libgvplugin-rsvg8 \
            libgvplugin-vt8 \
            libgvplugin-webp8 \
            libgvplugin-xlib8 \
            ttf-bitstream-vera \
            ttf-mscorefonts-installer \
            xournalpp
    - name: Show system information
      shell: bash
      run: |
        echo -e "### Runner"
        echo "runner.name=${{ runner.name }}"
        echo "runner.os=${{ runner.os }}"
        echo "runner.arch=${{ runner.arch }}"
        echo -e "\n### OS"
        cat /etc/os-release
        echo -e "\n### Packages"
        dpkg-query --list
        if which dot &>/dev/null; then
          echo -e "\n### graphviz"
          echo | dot -v 2>&1
          echo
          cat /usr/lib/x86_64-linux-gnu/graphviz/config8
          echo
          dpkg-query --listfiles graphviz
        fi
